name: Publicar no GitHub Pages

on:
  push:
    # branch padrao atual do repositorio; 'main' fica previsto caso
    # o projeto seja promovido para ela mais adiante
    branches:
      - claude/tqs-moment-calculator-s3qlnv
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # enablement liga o GitHub Pages na primeira execucao, sem precisar
      # mexer em Settings -> Pages
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Reunir os arquivos do site (a ferramenta e estatica, sem build)
        run: |
          mkdir -p _site
          cp index.html manifest.json sw.js README.md LICENSE _site/
          cp -r css js icons cisalhamento _site/

      - name: Empacotar
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
